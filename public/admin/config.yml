backend:
  name: github
  repo: sitradu/sitradu.github.io
  branch: main

# Carpeta donde se guardan las imágenes subidas desde el editor
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

# Vista previa local del build (opcional, útil si corrés `hugo server` en paralelo)
local_backend: true

collections:
  - name: "noticias"
    label: "Noticias"
    label_singular: "Noticia"
    folder: "content/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Resumen (para el listado)", name: "resumen", widget: "text", required: false }
      - { label: "Imagen de portada", name: "imagen", widget: "image", required: false }
      - { label: "Cuerpo de la noticia", name: "body", widget: "markdown" }

  - name: "enlaces"
    label: "Enlaces"
    label_singular: "Enlace"
    folder: "content/enlaces"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    sortable_fields: ["date", "title", "fuente"]
    fields:
      - { label: "Título de la nota", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "URL de la noticia", name: "enlace_url", widget: "string", pattern: ['^https?://.+', "Tiene que ser una URL completa (con http:// o https://)"] }
      - { label: "Medio / fuente", name: "fuente", widget: "string", required: false }
      - { label: "Resumen (para el listado)", name: "resumen", widget: "text", required: false }
