baseURL = "https://sitradu.github.io/"
languageCode = "es-ar"
title = "Sindicato Docente — FIUNER"

# Taxonomías por defecto de Hugo (categories/tags) desactivadas: no se usan
# en este sitio. El front matter viejo que las incluya se ignora sin error.
# (Tiene que ir antes de cualquier sección [tabla]; si no, TOML la
# interpreta como parte de la última tabla abierta, no de la raíz.)
disableKinds = ["taxonomy", "term"]

# Paginación de las listas (noticias + enlaces combinados)
[pagination]
  pagerSize = 15

[params]
  description = "Sitio informativo del sindicato docente"

[menu]
  [[menu.main]]
    name = "Inicio"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Noticias"
    url = "/noticias/"
    weight = 2
  [[menu.main]]
    name = "Enlaces"
    url = "/enlaces/"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true
