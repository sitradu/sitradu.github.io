<figure class="gallery-item">
  <a href="{{ .Get "src" }}"
     class="gallery-lightbox"
     data-caption="{{ .Get "caption" | default (.Get "alt") }}">
    <img
      src="{{ .Get "src" }}"
      alt="{{ .Get "alt" | default "" }}"
      loading="lazy">
  </a>

  {{ with .Get "caption" }}
    <figcaption>{{ . }}</figcaption>
  {{ end }}
</figure>
