{{ define "main" }}
<article class="single-noticia">
  <h1>{{ .Title }}</h1>
  <p class="item-date">{{ .Date.Format "02/01/2006" }}</p>
  {{ with .Params.imagen }}
    <img class="cover" src="{{ . | relURL }}" alt="{{ $.Title }}">
  {{ end }}
  <div class="content">
    {{ .Content }}
  </div>
  <p><a href="{{ "/noticias/" | relURL }}">← Volver a noticias</a></p>
</article>
{{ end }}
