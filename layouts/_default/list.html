{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
<div class="item-list">
  {{ range .Pages.ByDate.Reverse }}
    <article class="item">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p class="item-date">{{ .Date.Format "02/01/2006" }}</p>
    </article>
  {{ end }}
</div>
{{ end }}
